[package]
name = "rrss"
version = "0.1.1"
edition = "2024"
description = "拾阅，一款专注阅读体验的 Windows 桌面 RSS 阅读器"
license = "MIT"
repository = "https://github.com/idkwhatimdoing62/shiyue-rss"
homepage = "https://github.com/idkwhatimdoing62/shiyue-rss"
readme = "README.md"
keywords = ["rss", "reader", "desktop", "egui"]
categories = ["gui"]
autobins = false

[[bin]]
name = "shiyue"
path = "src/main.rs"

[[bin]]
name = "shiyue-cli"
path = "src/bin/shiyue-cli.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_extras = { version = "0.35.0", features = ["image", "http"] }
feed-rs = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = "4.18.0"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "gzip", "http2", "blocking"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = "0.19"
